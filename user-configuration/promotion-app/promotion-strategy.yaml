apiVersion: promoter.argoproj.io/v1alpha1
kind: PromotionStrategy
metadata:
  annotations:
  name: argocon-demo
  namespace: default
spec:
  orderCommitStatusRef:
    group: promoter.argoproj.io
    kind: DependentsSuccessfulCommitStatus
    name: active-checks-dscs
  activeCommitStatuses:
  - key: argocd-health
  environments:
  - branch: environments/development
    autoMerge: false
  - branch: environments/staging-e2e
    dependsOn:
    - environments/development
  - branch: environments/staging-integration
    dependsOn:
    - environments/development
  - branch: environments/production-use
    dependsOn:
    - environments/staging-e2e
    - environments/staging-integration
    proposedCommitStatuses:
    - key: change-management-approval
    - key: change-management-open
    activeCommitStatuses:
    - key: change-management-close
  - branch: environments/production-usw
    dependsOn:
    - environments/staging-e2e
    - environments/staging-integration
    proposedCommitStatuses:
    - key: change-management-approval
    - key: change-management-open
    activeCommitStatuses:
    - key: change-management-close
  gitRepositoryRef:
    name: argocon-demo
