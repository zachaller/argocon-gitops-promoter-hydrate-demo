# Gate promotion on GitHub's *actually required* checks, and name the ones that
# are not passing.
#
# Uses the GitHub GraphQL API rather than REST because only GraphQL exposes
# `isRequired`, which resolves branch protection / rulesets for you. That removes
# the hand-maintained allowlist that the REST version
# (webrequest-github-required-checks.yaml) needs, while still giving you the
# individual check names that the PR-level `mergeable_state` field cannot.
#
# Both required check runs (GitHub Actions and friends) and required legacy
# status contexts are covered. A required check that has not reported yet shows
# up as an EXPECTED status context, so it is counted as still pending rather
# than silently passing.
#
# Before applying, replace promotionStrategyRef.name with your PromotionStrategy.
# Owner and repo are derived from the pull request URL, so there is nothing else
# to hardcode.
#
# One caveat: if you mark this gate's own check run ("<key>/<branch>") as
# required in branch protection, it becomes required-and-pending forever and the
# promotion deadlocks. Don't do that.
apiVersion: promoter.argoproj.io/v1alpha1
kind: WebRequestCommitStatus
metadata:
  name: github-required-checks
  namespace: default
spec:
  promotionStrategyRef:
    name: argocon-demo
  key: github-required-checks
  reportOn: proposed

  descriptionTemplate: >-
    {{ if .SuccessOutput }}{{ index .SuccessOutput "summary" }}{{ else }}Waiting for GitHub required checks{{ end }}

  urlTemplate: >-
    {{- range .PromotionStrategy.Status.Environments }}{{- if eq .Branch $.Branch }}{{ if .PullRequest }}{{ .PullRequest.Url }}{{ end }}{{- end }}{{- end }}

  httpRequest:
    urlTemplate: "https://api.github.com/graphql"
    methodTemplate: POST
    headerTemplates:
      # merge-info-preview is what unlocks mergeStateStatus on older GitHub
      # Enterprise Server schemas; it is a no-op on github.com where the field
      # is already GA.
      Accept: "application/vnd.github.merge-info-preview+json"
      X-GitHub-Api-Version: "2022-11-28"
    authentication:
      scm: {}
    timeout: 30s
    # Two things are fetched in one call:
    #   pullRequest.mergeStateStatus — GitHub's own verdict, which knows about
    #     required checks that have not reported yet (see success.when below).
    #   object(oid:).statusCheckRollup — the per-check detail used for naming.
    # The commit is fetched by oid rather than as "the PR's head commit" so the
    # gate always reports on exactly the hydrated SHA promoter is promoting.
    bodyTemplate: >-
      {{- range .PromotionStrategy.Status.Environments }}{{- if eq .Branch $.Branch }}
      {"query":"query($owner:String!,$repo:String!,$oid:GitObjectID!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){mergeStateStatus}object(oid:$oid){... on Commit{statusCheckRollup{contexts(first:100){nodes{__typename ... on CheckRun{name status conclusion isRequired(pullRequestNumber:$pr)} ... on StatusContext{context state isRequired(pullRequestNumber:$pr)}}}}}}}}",
      "variables":{"owner":"{{ index (splitList "/" (trimPrefix "https://github.com/" .PullRequest.Url)) 0 }}","repo":"{{ index (splitList "/" (trimPrefix "https://github.com/" .PullRequest.Url)) 1 }}","oid":"{{ .Proposed.Hydrated.Sha }}","pr":{{ .PullRequest.ID }}}}
      {{- end }}{{- end }}

  success:
    when:
      # requiredContexts below is computed, not configured: GitHub's isRequired
      # field resolves branch protection and rulesets, so there is no list of
      # check names to maintain anywhere in this file.
      variables:
        expression: |
          let envStatus = find(PromotionStrategy.Status.Environments, {.Branch == Branch});
          let wrcsEnv = find(WebRequestCommitStatus.Status.Environments ?? [], {.Branch == Branch});
          let nodes = Response == nil ? [] : (Response.Body?.data?.repository?.object?.statusCheckRollup?.contexts?.nodes ?? []);
          let requiredContexts = filter(nodes, (#.isRequired ?? false) == true);
          let passed = ["SUCCESS", "SKIPPED", "NEUTRAL"];
          let waiting = ["EXPECTED", "PENDING", "QUEUED", "IN_PROGRESS", "WAITING", "REQUESTED"];
          let normalized = map(requiredContexts, #.__typename == "CheckRun"
            ? {name: #.name, state: #.status != "COMPLETED" ? (#.status ?? "PENDING") : (#.conclusion ?? "UNKNOWN")}
            : {name: #.context, state: #.state ?? "UNKNOWN"});
          {
            reportedSha: envStatus != nil ? envStatus.Proposed.Hydrated.Sha : "",
            lastSuccessfulSha: wrcsEnv != nil ? (wrcsEnv.LastSuccessfulSha ?? "") : "",
            graphqlErrors: Response == nil ? [] : map(Response.Body?.errors ?? [], #.message ?? "unknown error"),
            mergeState: Response == nil ? "" : (Response.Body?.data?.repository?.pullRequest?.mergeStateStatus ?? "UNKNOWN"),
            total: len(normalized),
            failing: map(filter(normalized, !(#.state in passed) && !(#.state in waiting)), #.name + " (" + lower(#.state) + ")"),
            running: map(filter(normalized, #.state in waiting), #.name)
          }

      # GraphQL answers 200 even for query errors, so errors are checked explicitly.
      #
      # mergeState is the authoritative half of this gate, not a nicety. A check
      # that is required but has never reported is frequently ABSENT from
      # statusCheckRollup.contexts rather than present as EXPECTED, so the
      # failing/running lists alone would fail open and promote. GitHub itself
      # knows about the unreported check and answers BLOCKED, so the merge state
      # is what makes this safe; the per-check lists exist to name what is wrong.
      #
      # UNSTABLE must be accepted: it means "mergeable, some non-required check is
      # not passing", which is the state this gate's own pending check run creates.
      expression: |
        Response == nil
          ? (Phase == "success" && Variables.lastSuccessfulSha == Variables.reportedSha)
          : Response.StatusCode == 200 &&
            len(Variables.graphqlErrors) == 0 &&
            len(Variables.failing) == 0 &&
            len(Variables.running) == 0 &&
            Variables.mergeState in ["CLEAN", "UNSTABLE", "HAS_HOOKS"]

      output:
        expression: |
          let fresh = {sha: Variables.reportedSha, summary: "Waiting for GitHub required checks", failing: [], running: []};
          let mergeable = Variables.mergeState in ["CLEAN", "UNSTABLE", "HAS_HOOKS"];
          let named = trim(
            (len(Variables.failing) > 0 ? "Failing: " + join(Variables.failing, ", ") + "; " : "") +
            (len(Variables.running) > 0 ? "Waiting on: " + join(Variables.running, ", ") : ""),
            "; ");
          let blockedReason = {
            "BLOCKED": "Blocked by branch protection — a required review or a required check that has not reported yet",
            "BEHIND": "Branch is out of date with its base branch",
            "DIRTY": "Merge conflict with the base branch",
            "DRAFT": "Pull request is still a draft",
            "UNKNOWN": "GitHub is still computing the merge state"
          };
          Response == nil
            ? ((SuccessOutput != nil && (SuccessOutput.sha ?? "") == Variables.reportedSha) ? SuccessOutput : fresh)
            : {
                sha: Variables.reportedSha,
                mergeState: Variables.mergeState,
                failing: Variables.failing,
                running: Variables.running,
                summary: len(Variables.graphqlErrors) > 0
                  ? "GitHub API error: " + join(Variables.graphqlErrors, "; ")
                  : (named != ""
                      ? named
                      : (mergeable
                          ? (Variables.total == 0
                              ? "No required checks configured"
                              : "All " + string(Variables.total) + (Variables.total == 1 ? " required check passed" : " required checks passed"))
                          : (blockedReason[Variables.mergeState] ?? ("Not mergeable (state: " + Variables.mergeState + ")"))))
              }

  mode:
    context: environments
    # Trigger rather than polling: only spend a GraphQL call when this environment
    # has an open PR, is at the front of the promotion queue, and has not already
    # been verified for the current hydrated SHA.
    trigger:
      requeueDuration: 2m
      when:
        expression: |
          let envStatus = find(PromotionStrategy.Status.Environments, {.Branch == Branch});
          let wrcsEnv = find(WebRequestCommitStatus.Status.Environments ?? [], {.Branch == Branch});
          let lastSuccessfulSha = wrcsEnv != nil ? (wrcsEnv.LastSuccessfulSha ?? "") : "";
          let idx = findIndex(PromotionStrategy.Status.Environments, #.Branch == Branch);
          let ahead = idx == nil || idx == 0 ? [] : PromotionStrategy.Status.Environments[:idx];
          envStatus != nil &&
          envStatus.PullRequest != nil &&
          (envStatus.PullRequest.ID ?? "") != "" &&
          string(envStatus.PullRequest.State) == "open" &&
          all(ahead, #.PullRequest == nil || string(#.PullRequest.State) != "open") &&
          lastSuccessfulSha != envStatus.Proposed.Hydrated.Sha
