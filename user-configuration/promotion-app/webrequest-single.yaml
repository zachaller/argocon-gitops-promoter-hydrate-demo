apiVersion: promoter.argoproj.io/v1alpha1
kind: WebRequestCommitStatus
metadata:
  name: change-management-close
  namespace: default
spec:
  promotionStrategyRef:
    name: argocon-demo
  key: change-management-close
  reportOn: active
  # Closes the change record after promotion PRs have merged (SUCCEEDED), or
  # cancels an unfinished record when a newer dry SHA arrives (POST /change/cancel/{id}).
  # Two-phase: first GET searches for the change record by dry SHA, then POST closes/cancels it.
  descriptionTemplate: >-
    {{- $changeId := "" -}}{{- $step := "" -}}{{- $statusCode := 0 -}}
    {{- if .ResponseOutput -}}
      {{- $changeId   = index .ResponseOutput "changeId"   | default "" -}}
      {{- $step       = index .ResponseOutput "step"       | default "" -}}
      {{- $statusCode = index .ResponseOutput "statusCode" | default 0 | int -}}
    {{- end -}}
    {{- /* The close POST response carries no changeId, so fall back to the in-flight value or the last persisted one. */ -}}
    {{- if eq $changeId "" -}}
      {{- if .TriggerVariables -}}{{- $changeId = index .TriggerVariables "priorChangeId" | default "" -}}{{- end -}}
      {{- if and (eq $changeId "") .TriggerOutput -}}{{- $changeId = index .TriggerOutput "lastClosedChangeId" | default "" -}}{{- end -}}
    {{- end -}}
    {{- $drySha := "" -}}{{- $currentFingerprint := "" -}}{{- $isSupersede := false -}}
    {{- if .TriggerVariables -}}
      {{- $drySha             = index .TriggerVariables "searchCommitId"       | default "" -}}
      {{- $currentFingerprint = index .TriggerVariables "fingerprint"         | default "" -}}
      {{- $isSupersede        = index .TriggerVariables "isSupersede"         | default false -}}
    {{- end -}}
    {{- $lastFiredFingerprint := "" -}}
    {{- if .TriggerOutput -}}{{- $lastFiredFingerprint = index .TriggerOutput "lastFingerprint" | default "" -}}{{- end -}}
    {{- $shaShort := "" -}}{{- if ne $drySha "" -}}{{- $shaShort = substr 0 7 $drySha -}}{{- end -}}
    {{- /* Stale = a new dry SHA arrived but the trigger hasn't fired yet, so any ResponseOutput is from the previous SHA.
         Supersede intentionally fires against the *previous* fingerprint, so do not treat that roll as stale. */ -}}
    {{- $stale := and (not $isSupersede) (ne $currentFingerprint "") (ne $currentFingerprint $lastFiredFingerprint) -}}
    {{ .Phase }}:
    {{- if or (not .ResponseOutput) $stale }} searching for change record to close{{ if ne $shaShort "" }} for commit {{ $shaShort }}{{ end }}
    {{- else if and (eq $step "closed") $isSupersede }} cancelled change {{ $changeId }}{{ if ne $shaShort "" }} for commit {{ $shaShort }}{{ end }}
    {{- else if eq $step "closed" }} closed change {{ $changeId }}{{ if ne $shaShort "" }} for commit {{ $shaShort }}{{ end }}
    {{- else if eq $step "closeFailedTerminal" }} close gave up for {{ $changeId }} (HTTP {{ $statusCode }}) — treating as done
    {{- else if eq $step "closeRetry" }} close failed for {{ $changeId }} (HTTP {{ $statusCode }}), will retry
    {{- else if and (eq $step "found") $isSupersede }} found change {{ $changeId }} to supersede — cancelling on next reconcile
    {{- else if eq $step "found" }} found change {{ $changeId }} — closing on next reconcile
    {{- else if and (eq $step "searching") $isSupersede }} no APPROVED/CONDITIONALLY_APPROVED change record to supersede{{ if ne $shaShort "" }} for commit {{ $shaShort }}{{ end }} — nothing to cancel
    {{- else if eq $step "searching" }} no APPROVED/CONDITIONALLY_APPROVED change record{{ if ne $shaShort "" }} for commit {{ $shaShort }}{{ end }} — nothing to close
    {{- else }} searching for change record to close{{ if ne $shaShort "" }} for commit {{ $shaShort }}{{ end }}
    {{- end }}
  urlTemplate: >-
    {{- $assetId := index .NamespaceMetadata.Labels "argocd.intuit.com/asset-id" -}}
    {{- $ghDomain := index .NamespaceMetadata.Labels "argocd.intuit.com/github-domain" -}}
    {{- $portalHost := "devportal.intuit.com" -}}
    {{- if eq $ghDomain "github-dev" -}}{{- $portalHost = "devportal-e2e.intuit.com" -}}{{- end -}}
    {{- if ne $assetId "" -}}https://{{ $portalHost }}/app/dp/resource/{{ $assetId }}/changeManagement?asset={{ printf "{\"assetId\":\"%s\"}" $assetId | urlquery }}{{- end -}}
  httpRequest:
    # GET to search; POST /change/close/{id} on success path, POST /change/cancel/{id} on supersede.
    methodTemplate: >-
      {{- if index .TriggerVariables "inCloseMode" -}}POST{{- else -}}GET{{- end -}}
    timeout: 30s
    headerTemplates:
      Accept: application/json
      Content-Type: application/json
    urlTemplate: >-
      {{- $base := "http://localhost:8987/v1/change-management-service" -}}
      {{- $assetId := index .NamespaceMetadata.Labels "argocd.intuit.com/asset-id" -}}
      {{- if index .TriggerVariables "inCloseMode" -}}
      {{- if index .TriggerVariables "isSupersede" -}}
      {{ $base }}/change/cancel/{{ index .TriggerVariables "priorChangeId" }}
      {{- else -}}
      {{ $base }}/change/close/{{ index .TriggerVariables "priorChangeId" }}
      {{- end -}}
      {{- else -}}
      {{ $base }}/changes/search?asset_id={{ $assetId }}&commit_id={{ index .TriggerVariables "searchCommitId" }}&limit=25
      {{- end -}}
    bodyTemplate: |
      {{- if and (index .TriggerVariables "inCloseMode") (not (index .TriggerVariables "isSupersede")) -}}
      {
        "change_execution_status": "SUCCEEDED",
        "end_time": "{{ now | date "2006-01-02T15:04:05Z07:00" }}",
        "message": "every gated production environments pull requests have been merged"
      }
      {{- end -}}
  success:
    when:
      # Never report failure. Pending only while a found record is waiting on (or retrying) close.
      # Body shape distinguishes search responses (have change_records) from close responses.
      # Search: success when there is no APPROVED / CONDITIONALLY_APPROVED record to close
      # (empty results, or only non-approved statuses — same as "nothing to close").
      expression: |
        Response != nil
          ? (Response.Body != nil && (Response.Body.change_records ?? nil) != nil
              ? len(filter(Response.Body.change_records ?? [], {
                  (#.status ?? "") == "APPROVED" || (#.status ?? "") == "CONDITIONALLY_APPROVED"
                })) == 0
              : ((Response.StatusCode >= 200 && Response.StatusCode < 300) ||
                 (Response.StatusCode >= 400 && Response.StatusCode != 429 && Response.StatusCode < 500)))
          : (ResponseOutput == nil ||
             ((ResponseOutput.step ?? "") != "found" &&
              (ResponseOutput.step ?? "") != "closeRetry"))
  mode:
    context: promotionstrategy
    trigger:
      requeueDuration: 30s
      when:
        variables:
          # Compute everything the trigger and HTTP templates need:
          # - gating: this key is wired up, all gated envs have merged their promotion PRs
          # - dry SHA alignment / fingerprint over proposed note dry SHAs
          # - observedFingerprint/DrySha: last stable SHA set we tracked (even with open PRs)
          # - isSupersede: fingerprint rolled away from an unfinished observed SHA → cancel that CR
          # - close-phase state: did a previous reconcile already find a change record to close
          expression: |
            let key = "change-management-close";
            let specEnvs = PromotionStrategy.Spec.Environments ?? [];
            let statusEnvs = PromotionStrategy.Status.Environments ?? [];
            let keyIsGlobal = any(PromotionStrategy.Spec.ActiveCommitStatuses ?? [], {#.Key == key});
            let gatedEnvs = filter(specEnvs, {
              keyIsGlobal || any(#.ActiveCommitStatuses ?? [], {#.Key == key})
            });
            let allGatedPRsMerged = len(gatedEnvs) > 0 && all(gatedEnvs, {
              let env = #;
              let status = find(statusEnvs, { #.Branch == env.Branch });
              status == nil || status.PullRequest == nil || string(status.PullRequest.State) != "open"
            });
            // Per spec-env {branch, proposed-note dry SHA} pairs (sha "" when absent), spec order.
            // Everything downstream (dry-SHA alignment, canonical SHA, fingerprint) derives from this.
            let envShas = map(specEnvs, {
              let env = #;
              let status = find(statusEnvs, { #.Branch == env.Branch });
              { branch: env.Branch, sha: status != nil && status.Proposed.Note != nil && status.Proposed.Note.DrySha != "" ? status.Proposed.Note.DrySha : "" }
            });
            let everyEnvHasDrySha = len(envShas) > 0 && all(envShas, { #.sha != "" });
            let canonicalNoteDrySha = len(envShas) > 0 ? envShas[0].sha : "";
            let allNoteDryShasMatch = everyEnvHasDrySha && all(envShas, { #.sha == canonicalNoteDrySha });
            let fingerprint = join(map(envShas, { #.branch + ":" + #.sha }), "|");
            let observedFingerprint = TriggerOutput.observedFingerprint ?? "";
            let observedDrySha = TriggerOutput.observedDrySha ?? "";
            let observedWasDone = observedFingerprint != "" &&
              observedFingerprint == (TriggerOutput.lastDoneFingerprint ?? "");
            let fingerprintRolledAway = observedFingerprint != "" && fingerprint != observedFingerprint;
            // Supersede when the dry-SHA fingerprint moves on before we latched the prior one as done.
            let isSupersede = fingerprintRolledAway && !observedWasDone && observedDrySha != "";
            let priorStep = ResponseOutput != nil ? (ResponseOutput.step ?? "") : "";
            let priorChangeId = ResponseOutput != nil ? (ResponseOutput.changeId ?? "") : "";
            let haveChangeIdToClose = priorChangeId != "" &&
              (priorStep == "found" || priorStep == "closeRetry");
            let activeFingerprint = isSupersede ? observedFingerprint : fingerprint;
            let alreadyDoneForActive = activeFingerprint != "" &&
              activeFingerprint == (TriggerOutput.lastDoneFingerprint ?? "");
            let isNewActiveFingerprint = activeFingerprint != (TriggerOutput.lastFingerprint ?? "");
            let needsRetry = !isNewActiveFingerprint && priorStep == "closeRetry";
            // Empty succeed-path search must not permanently latch — the CR often appears only
            // after open/approval (dry SHAs can align while gated PRs are still absent/closed).
            // Re-search until we find an APPROVED/CA record, close it, or the fingerprint moves on.
            // Supersede empty search is different: that path latches done via supersedeSearchEmpty.
            let needsSearchRetry = !isNewActiveFingerprint && !isSupersede && priorStep == "searching";
            let shouldSucceedClose = allNoteDryShasMatch &&
              allGatedPRsMerged &&
              !isSupersede &&
              !alreadyDoneForActive &&
              (isNewActiveFingerprint || haveChangeIdToClose || needsRetry || needsSearchRetry);
            let shouldSupersedeClose = isSupersede &&
              !alreadyDoneForActive &&
              (isNewActiveFingerprint || haveChangeIdToClose || needsRetry);
            let shouldTrigger = shouldSucceedClose || shouldSupersedeClose;
            {
              allGatedPRsMerged: allGatedPRsMerged,
              allNoteDryShasMatch: allNoteDryShasMatch,
              fingerprint: fingerprint,
              canonicalNoteDrySha: canonicalNoteDrySha,
              searchCommitId: isSupersede ? observedDrySha : canonicalNoteDrySha,
              observedFingerprint: observedFingerprint,
              observedDrySha: observedDrySha,
              isSupersede: isSupersede,
              haveChangeIdToClose: haveChangeIdToClose,
              alreadyDoneForFingerprint: alreadyDoneForActive,
              isNewFingerprint: isNewActiveFingerprint,
              needsRetry: needsRetry,
              needsSearchRetry: needsSearchRetry,
              shouldSucceedClose: shouldSucceedClose,
              shouldSupersedeClose: shouldSupersedeClose,
              shouldTrigger: shouldTrigger,
              priorStep: priorStep,
              priorChangeId: priorChangeId,
              inCloseMode: haveChangeIdToClose,
              activeFingerprint: activeFingerprint
            }
        # Fire for a normal SUCCEEDED close (all gated PRs merged) or a supersede
        # cancel when the fingerprint rolls before the prior change was closed.
        expression: |
          Variables.shouldTrigger
        output:
          # Persist state across reconciles:
          # - observedFingerprint/DrySha: last stable proposed SHA set (updated even when not firing)
          # - lastFingerprint: the fingerprint we last fired the trigger on (observed during supersede)
          # - lastDoneFingerprint: terminal state reached (closed / terminal 4xx / empty supersede search)
          # - lastClosedChangeId: surfaces the closed id to the description template
          expression: |
            let shouldTrigger = Variables.shouldTrigger;
            let activeFingerprint = Variables.activeFingerprint;
            let priorMatchesActive = activeFingerprint != "" &&
              activeFingerprint == (TriggerOutput.lastFingerprint ?? "");
            let justClosed = priorMatchesActive && Variables.priorStep == "closed";
            // Empty supersede search means there was nothing to cancel — latch the old fingerprint done.
            let supersedeSearchEmpty = Variables.isSupersede && priorMatchesActive && Variables.priorStep == "searching";
            let justDone = priorMatchesActive &&
              (Variables.priorStep == "closed" ||
               Variables.priorStep == "closeFailedTerminal" ||
               supersedeSearchEmpty);
            let isFiringClosePost = shouldTrigger && Variables.inCloseMode && Variables.haveChangeIdToClose;
            let nextObservedFingerprint = justDone && Variables.isSupersede
              ? (Variables.allNoteDryShasMatch ? Variables.fingerprint : "")
              : (!Variables.isSupersede && Variables.allNoteDryShasMatch
                  ? Variables.fingerprint
                  : (TriggerOutput.observedFingerprint ?? ""));
            let nextObservedDrySha = justDone && Variables.isSupersede
              ? (Variables.allNoteDryShasMatch ? Variables.canonicalNoteDrySha : "")
              : (!Variables.isSupersede && Variables.allNoteDryShasMatch
                  ? Variables.canonicalNoteDrySha
                  : (TriggerOutput.observedDrySha ?? ""));
            {
              // Used elsewhere (read by templates / next reconciles):
              lastFingerprint: shouldTrigger ? activeFingerprint : (TriggerOutput.lastFingerprint ?? ""),
              lastDoneFingerprint: justDone ? activeFingerprint : (TriggerOutput.lastDoneFingerprint ?? ""),
              lastClosedChangeId: isFiringClosePost ? Variables.priorChangeId : (TriggerOutput.lastClosedChangeId ?? ""),
              observedFingerprint: nextObservedFingerprint,
              observedDrySha: nextObservedDrySha,
              // Informational only (surfaced for debugging / status visibility):
              lastClosedFingerprint: justClosed ? activeFingerprint : (TriggerOutput.lastClosedFingerprint ?? ""),
              shouldTrigger: shouldTrigger,
              // Clear once justDone advances/latches so status readers don't see a stale supersede flag.
              isSupersede: Variables.isSupersede && !justDone,
              priorMatchesCurrent: priorMatchesActive,
              fingerprint: Variables.fingerprint,
              canonicalNoteDrySha: Variables.canonicalNoteDrySha,
              phase: Phase,
              evaluatedAt: string(now())
            }
      response:
        output:
          # Parse the response. Search responses contain change_records, close responses do not.
          # Search: among APPROVED / CONDITIONALLY_APPROVED records, prefer in-window, then pick
          # the id whose change_request.start_time is closest to now; else "" .
          # Close:  2xx => "closed" (done), 429/5xx => "closeRetry", other 4xx => "closeFailedTerminal" (give up).
          expression: |
            let isSearch = Response.Body != nil && (Response.Body.change_records ?? nil) != nil;
            let priorChangeId = ResponseOutput != nil ? (ResponseOutput.changeId ?? "") : "";
            let closableRecords = isSearch
              ? filter(Response.Body.change_records ?? [], {
                  (#.status ?? "") == "APPROVED" || (#.status ?? "") == "CONDITIONALLY_APPROVED"
                })
              : [];
            let inWindowRecords = filter(closableRecords, {
                  date(#.change_request.start_time) <= now() && date(#.change_request.end_time) >= now()
                });
            let pool = len(inWindowRecords) > 0 ? inWindowRecords : closableRecords;
            let byClosestStart = sortBy(pool, abs((date(#.change_request.start_time) - now()).Seconds()));
            let foundChangeId = isSearch
              ? (len(byClosestStart) > 0 ? string(byClosestStart[0].id ?? "") : "")
              : priorChangeId;
            let statusCode = Response.StatusCode;
            let closeStep = statusCode >= 200 && statusCode < 300
              ? "closed"
              : (statusCode == 429 || statusCode >= 500 ? "closeRetry" : "closeFailedTerminal");
            let step = isSearch
              ? (foundChangeId != "" ? "found" : "searching")
              : closeStep;
            {
              // Used elsewhere (read by templates / next reconciles):
              statusCode: statusCode,
              step: step,
              changeId: foundChangeId,
              // Informational only (surfaced for debugging / status visibility):
              isSearch: isSearch,
              inWindowRecordCount: len(inWindowRecords),
              totalRecordCount: isSearch ? len(Response.Body.change_records ?? []) : 0,
              lastRequestedAt: string(now())
            }
---
apiVersion: promoter.argoproj.io/v1alpha1
kind: WebRequestCommitStatus
metadata:
  name: change-management-open
  namespace: default
spec:
  promotionStrategyRef:
    name: argocon-demo
  key: change-management-open
  reportOn: proposed
  # Two-phase: GET /change/{id}/status when a prior changeId exists, then POST /change/open
  # only when the prior record is expired, non-reusable, or the dry-SHA fingerprint rolled.
  descriptionTemplate: >-
    {{- $changeId := "" -}}{{- $step := "" -}}{{- $statusCode := 0 -}}{{- $startTime := "" -}}{{- $endTime := "" -}}{{- $shortDesc := "" -}}{{- $cmStatus := "" -}}
    {{- if .ResponseOutput -}}
      {{- $changeId   = index .ResponseOutput "changeId"           | default "" -}}
      {{- $step       = index .ResponseOutput "step"               | default "" -}}
      {{- $statusCode = index .ResponseOutput "statusCode"         | default 0 | int -}}
      {{- $startTime  = index .ResponseOutput "crStartTime"        | default "" -}}
      {{- $endTime    = index .ResponseOutput "crEndTime"          | default "" -}}
      {{- $shortDesc  = index .ResponseOutput "crShortDescription" | default "" -}}
      {{- $cmStatus   = index .ResponseOutput "cmStatus"           | default "" -}}
    {{- end -}}
    {{- if and (eq $changeId "") .TriggerVariables -}}{{- $changeId = index .TriggerVariables "priorChangeId" | default "" -}}{{- end -}}
    {{- $drySha := "" -}}{{- $currentFingerprint := "" -}}{{- $inOpenMode := false -}}{{- $inCancelMode := false -}}
    {{- if .TriggerVariables -}}
      {{- $drySha             = index .TriggerVariables "canonicalNoteDrySha" | default "" -}}
      {{- $currentFingerprint = index .TriggerVariables "fingerprint"         | default "" -}}
      {{- $inOpenMode         = index .TriggerVariables "inOpenMode"          | default false -}}
      {{- $inCancelMode       = index .TriggerVariables "inCancelMode"        | default false -}}
    {{- end -}}
    {{- $lastFiredFingerprint := "" -}}
    {{- if .TriggerOutput -}}{{- $lastFiredFingerprint = index .TriggerOutput "lastFingerprint" | default "" -}}{{- end -}}
    {{- $shaShort := "" -}}{{- if ne $drySha "" -}}{{- $shaShort = substr 0 7 $drySha -}}{{- end -}}
    {{- /* Stale = a new dry SHA arrived but the trigger hasn't fired yet, so ResponseOutput is from the previous SHA. */ -}}
    {{- $openHold := and (eq $step "opened") (ne $changeId "") -}}
    {{- $stale := and (ne $currentFingerprint "") (ne $currentFingerprint $lastFiredFingerprint) (not $openHold) -}}
    {{ .Phase }}:
    {{- if or (not .ResponseOutput) $stale }} preparing change record{{ if ne $shaShort "" }} for commit {{ $shaShort }}{{ end }}
    {{- else if eq $step "reusable" }} reusing change {{ $changeId }}{{ if ne $cmStatus "" }} ({{ $cmStatus }}){{ end }}
      {{- if and (ne $startTime "") (ne $endTime "") }} · window {{ $startTime }} → {{ $endTime }}{{- end }}
    {{- else if eq $step "rejected" }} change {{ $changeId }} was rejected — open stays success; change the dry SHA to open a new CR
    {{- else if eq $step "needCancel" }} prior change {{ $changeId }} will be cancelled before opening a new record
    {{- else if eq $step "cancelRetry" }} cancel failed for {{ $changeId }} (HTTP {{ $statusCode }}), will retry
    {{- else if eq $step "cancelled" }} cancelled change {{ $changeId }} — opening a new record on next reconcile
    {{- else if eq $step "cancelFailed" }} cancel failed for {{ $changeId }} (HTTP {{ $statusCode }}) — opening a new record anyway
    {{- else if eq $step "needOpen" }} prior change {{ $changeId }} needs a new record — opening on next reconcile
    {{- else if eq $step "getRetry" }} status check for {{ $changeId }} failed (HTTP {{ $statusCode }}), will retry
    {{- else if eq $step "openRetry" }} open failed for{{ if ne $changeId "" }} {{ $changeId }}{{ end }} (HTTP {{ $statusCode }}), will retry
    {{- else if and (eq $statusCode 202) (eq $changeId "") }} change request accepted (HTTP 202) but no ID returned — will retry
    {{- else if eq $step "openFailed" }} open failed{{ if ne $changeId "" }} for {{ $changeId }}{{ end }} (HTTP {{ $statusCode }})
    {{- else if and (eq $step "opened") (ne $changeId "") }} created change {{ $changeId }}
      {{- if ne $shortDesc "" }} — "{{ $shortDesc }}"{{- end -}}
      {{- if and (ne $startTime "") (ne $endTime "") }} · window {{ $startTime }} → {{ $endTime }}{{- end }}
    {{- else if and (eq $statusCode 202) (ne $changeId "") }} created change {{ $changeId }}
      {{- if ne $shortDesc "" }} — "{{ $shortDesc }}"{{- end -}}
      {{- if and (ne $startTime "") (ne $endTime "") }} · window {{ $startTime }} → {{ $endTime }}{{- end }}
    {{- else if or $inOpenMode $inCancelMode }} change request returned HTTP {{ $statusCode }} (will retry)
    {{- else }} status check returned HTTP {{ $statusCode }}, will retry
    {{- end }}
  urlTemplate: >-
    {{- $assetId := index .NamespaceMetadata.Labels "argocd.intuit.com/asset-id" -}}
    {{- $ghDomain := index .NamespaceMetadata.Labels "argocd.intuit.com/github-domain" -}}
    {{- $portalHost := "devportal.intuit.com" -}}
    {{- if eq $ghDomain "github-dev" -}}{{- $portalHost = "devportal-e2e.intuit.com" -}}{{- end -}}
    {{- if ne $assetId "" -}}https://{{ $portalHost }}/app/dp/resource/{{ $assetId }}/changeManagement?asset={{ printf "{\"assetId\":\"%s\"}" $assetId | urlquery }}{{- end -}}
  httpRequest:
    # GET /change/{id}/status; POST /change/cancel/{id} when replacing a prior CR;
    # POST /change/open when creating one.
    methodTemplate: >-
      {{- if or (index .TriggerVariables "inOpenMode") (index .TriggerVariables "inCancelMode") -}}POST{{- else -}}GET{{- end -}}
    timeout: 30s
    headerTemplates:
      Accept: application/json
      Content-Type: application/json
    urlTemplate: >-
      {{- $base := "http://localhost:8987/v1/change-management-service" -}}
      {{- if index .TriggerVariables "inCancelMode" -}}
      {{ $base }}/change/cancel/{{ index .TriggerVariables "priorChangeId" }}
      {{- else if index .TriggerVariables "inOpenMode" -}}
      {{ $base }}/change/open
      {{- else -}}
      {{ $base }}/change/{{ index .TriggerVariables "priorChangeId" }}/status
      {{- end -}}
    bodyTemplate: |
      {{- if index .TriggerVariables "inOpenMode" -}}
      {
        "asset_id": "{{- index .NamespaceMetadata.Labels "argocd.intuit.com/asset-id" -}}",
        "on_behalf_of": "{{ index .TriggerVariables "commitAuthor" }}",
        "short_description": "Automated production promotion process",
        "description": {{- $key := "change-management-open" -}}{{- $global := false -}}{{- range $.PromotionStrategy.Spec.ProposedCommitStatuses -}}{{- if eq .Key $key -}}{{- $global = true -}}{{- end -}}{{- end -}}{{- $out := printf "Production change-management record for GitOps promotion strategy `%s`.\n\n**What is changing:** the hydrated **SHA** on each branch below—that is the dry snapshot queued to move forward on that branch.\n\n**Where it is promoted (spec order):**\n" $.PromotionStrategy.Name -}}{{- range $se := $.PromotionStrategy.Spec.Environments -}}{{- $take := false -}}{{- if $global -}}{{- $take = true -}}{{- else -}}{{- range $se.ProposedCommitStatuses -}}{{- if eq .Key $key -}}{{- $take = true -}}{{- end -}}{{- end -}}{{- end -}}{{- if $take -}}{{- $sha := "" -}}{{- $pr := "" -}}{{- range $.PromotionStrategy.Status.Environments -}}{{- if eq .Branch $se.Branch -}}{{- if and .Proposed.Note .Proposed.Note.DrySha -}}{{- $sha = .Proposed.Note.DrySha -}}{{- end -}}{{- if .PullRequest -}}{{- if and (ne .PullRequest.Url "") (eq (printf "%s" .PullRequest.State) "open") -}}{{- $pr = .PullRequest.Url -}}{{- end -}}{{- end -}}{{- end -}}{{- end -}}{{- if ne $pr "" -}}{{- $disp := "—" -}}{{- if ne $sha "" -}}{{- $disp = $sha -}}{{- end -}}{{- $suffix := printf " — [PR](%s)" $pr -}}{{- $out = printf "%s\n- **%s** — SHA: `%s`%s" $out $se.Branch $disp $suffix -}}{{- end -}}{{- end -}}{{- end -}}{{- $out = printf "%s\n\n**Git repository ref:** `%s`" $out $.PromotionStrategy.Spec.RepositoryReference.Name -}}{{ $out | toJson }},
        "environment": "production",
        "backout_plan": "In the event that this new change introduces a regression in behavior or some other problem, a rollback to the previous version can be initiated through DevPortal or Argo CD.",
        "change_plan": "Automated GitOps promotion: proposed dry SHA advances through each environment via promoter pull requests, commit statuses, and merge gates before production.",
        "test_plan": "This change was initiated as part of a pipeline deployment and has been tested by all the automated tests that run as part of the pipeline.\n\nHowever, further testing by the team may be required after the successful deployment.\n\nAfter the deployment is completed, the team should perform the following validations:\n\n1. Verify the service is running as expected and all Golden Signals are healthy.\n2. Splunk logs and Wavefront dashboards do not show any unexpected errors or behavior.\n3. Run any functional tests (manual or automated) that are typically run after a deployment.\n4. Verify the new features and bug fixes included in this new version work as expected.",
        "category": "Application",
        "sub_category": "Release",
        "commit_id": "{{ index .TriggerVariables "canonicalNoteDrySha" }}",
        "start_time": "{{ now | date "2006-01-02T15:04:05Z07:00" }}",
        {{- $window := index .TriggerVariables "openWindowModifier" | default "+4h" -}}
        "end_time": "{{ now | dateModify $window | date "2006-01-02T15:04:05Z07:00" }}",
        "risk": "low",
        "repo_url": "{{- $ghDomain := index .NamespaceMetadata.Labels "argocd.intuit.com/github-domain" -}}{{- $ghHost := "github.intuit.com" -}}{{- if eq $ghDomain "github-dev" -}}{{- $ghHost = "github-dev.intuit.com" -}}{{- end -}}https://{{ $ghHost }}/{{ index .NamespaceMetadata.Labels "argocd.intuit.com/github-org" }}/{{ index .NamespaceMetadata.Labels "argocd.intuit.com/github-repo-name" }}"
      }
      {{- end -}}
  success:
    when:
      variables:
        # Fingerprint + GET-status decision so success.when can accept reuse/rejectedHold
        # without nesting lets in the boolean expression.
        expression: |
          let specEnvs = PromotionStrategy.Spec.Environments ?? [];
          let statusEnvs = PromotionStrategy.Status.Environments ?? [];
          let fingerprint = join(map(specEnvs, {
            let env = #;
            let status = find(statusEnvs, { #.Branch == env.Branch });
            env.Branch + ":" + (status != nil && status.Proposed.Note != nil && status.Proposed.Note.DrySha != "" ? status.Proposed.Note.DrySha : "")
          }), "|");
          let isStatusGet = Response != nil && Response.Body != nil && (Response.Body.status ?? nil) != nil;
          let cr = isStatusGet ? Response.Body.change_request : nil;
          let cmStatus = isStatusGet ? string(Response.Body.status ?? "") : "";
          let inWindow = cr != nil &&
            cr.start_time != nil && cr.end_time != nil &&
            date(cr.start_time) <= now() && date(cr.end_time) >= now();
          let openedFp = string(TriggerOutput["openedFingerprint"] ?? "");
          let sameFp = openedFp != "" && openedFp == fingerprint;
          // Same-fingerprint reusable/rejected GETs are success (do not mint a new CR).
          // A new fingerprint always leaves GET pending so the next reconcile can POST open.
          let getSuccess = isStatusGet && Response.StatusCode == 200 && sameFp && inWindow &&
            (cmStatus == "APPROVED" || cmStatus == "CONDITIONALLY_APPROVED" || cmStatus == "REJECTED");
          let openSuccess = Response != nil && !isStatusGet &&
            Response.StatusCode == 202 &&
            Response.Body != nil &&
            Response.Body.id != nil &&
            Response.Body.id != "";
          // Hold success after POST open until a later HTTP response replaces step (e.g. GET
          // needOpen). Avoids dropping to pending when fingerprint drifts or gates block before
          // get-before-open can run.
          let openHold = Response == nil &&
            ResponseOutput != nil &&
            string(ResponseOutput.step ?? "") == "opened" &&
            string(ResponseOutput.changeId ?? "") != "";
          {
            fingerprint: fingerprint,
            getSuccess: getSuccess,
            openSuccess: openSuccess,
            openHold: openHold
          }
      # Success when:
      # - POST open returned 202 with a body.id, or
      # - GET status is reusable/rejected on the same openedFingerprint, or
      # - (no HTTP this reconcile) prior POST open succeeded (openHold), or
      # - (no HTTP this reconcile) we're already in success on the same fingerprint and not mid-flight.
      expression: |
        Response != nil
          ? (Variables.openSuccess || Variables.getSuccess)
          : (Variables.openHold ||
             (Phase == "success" &&
              Variables.fingerprint == (TriggerOutput["lastFingerprint"] ?? "") &&
              (ResponseOutput == nil ||
               ((ResponseOutput.step ?? "") != "needOpen" &&
                (ResponseOutput.step ?? "") != "needCancel" &&
                (ResponseOutput.step ?? "") != "cancelled" &&
                (ResponseOutput.step ?? "") != "cancelFailed" &&
                (ResponseOutput.step ?? "") != "openRetry" &&
                (ResponseOutput.step ?? "") != "cancelRetry" &&
                (ResponseOutput.step ?? "") != "getRetry" &&
                !(((ResponseOutput.step ?? "") == "reusable" || (ResponseOutput.step ?? "") == "rejected") &&
                  string(TriggerOutput["openedFingerprint"] ?? "") != Variables.fingerprint)))))
  mode:
    context: promotionstrategy
    trigger:
      requeueDuration: 30s
      when:
        variables:
          # Compute trigger gates plus get-before-open phase flags:
          # - hasOpenPRForKey / allNoteDryShasMatch / preGateNoOpenPR / otherProposedChecksSuccess
          # - fingerprint / isNewFingerprint / needsRetry / needsAuthorRetry
          # - inGetMode: GET prior change status before deciding to open
          # - inOpenMode: POST /change/open (no prior id, or prior GET said needOpen / openRetry)
          expression: |
            let key = "change-management-open";
            let specEnvs = PromotionStrategy.Spec.Environments ?? [];
            let statusEnvs = PromotionStrategy.Status.Environments ?? [];
            let keyIsGlobal = any(PromotionStrategy.Spec.ProposedCommitStatuses ?? [], {#.Key == key});
            let keyedEnvs = filter(specEnvs, {
              keyIsGlobal || any(#.ProposedCommitStatuses ?? [], {#.Key == key})
            });
            let firstGatedBranch = len(keyedEnvs) > 0 ? keyedEnvs[0].Branch : "";
            let firstGatedIdx = firstGatedBranch != "" ? findIndex(specEnvs, { #.Branch == firstGatedBranch }) : nil;
            let preGatedEnvs = (firstGatedIdx != nil && firstGatedIdx > 0)
              ? take(specEnvs, firstGatedIdx)
              : [];
            let preGateNoOpenPR = all(preGatedEnvs, {
              let env = #;
              let status = find(statusEnvs, { #.Branch == env.Branch });
              status == nil || status.PullRequest == nil || string(status.PullRequest.State) != "open"
            });
            // Per spec-env {branch, proposed-note dry SHA} pairs (sha "" when absent), spec order.
            // Everything downstream (dry-SHA alignment, canonical SHA, fingerprint) derives from this.
            let envShas = map(specEnvs, {
              let env = #;
              let status = find(statusEnvs, { #.Branch == env.Branch });
              { branch: env.Branch, sha: status != nil && status.Proposed.Note != nil && status.Proposed.Note.DrySha != "" ? status.Proposed.Note.DrySha : "" }
            });
            let everyEnvHasDrySha = len(envShas) > 0 && all(envShas, { #.sha != "" });
            let canonicalNoteDrySha = len(envShas) > 0 ? envShas[0].sha : "";
            let allNoteDryShasMatch = everyEnvHasDrySha && all(envShas, { #.sha == canonicalNoteDrySha });
            let fingerprint = join(map(envShas, { #.branch + ":" + #.sha }), "|");
            // The gated envs (those configured with the change-management-open proposed check)
            // that currently have an open promotion PR, in spec order.
            let gatedEnvsWithOpenPR = filter(keyedEnvs, {
              let env = #;
              let status = find(statusEnvs, { #.Branch == env.Branch });
              status != nil && status.PullRequest != nil && string(status.PullRequest.State) == "open"
            });
            let hasOpenPRForKey = len(gatedEnvsWithOpenPR) > 0;
            // The lowest (first in spec order) gated env with an open PR. Before opening the
            // change record we require that env's *other* proposed commit statuses to all be
            // success, excluding the two change-management gates this flow itself drives
            // (change-management-open, change-management-approval).
            let lowestOpenGatedStatus = len(gatedEnvsWithOpenPR) > 0
              ? find(statusEnvs, { #.Branch == gatedEnvsWithOpenPR[0].Branch })
              : nil;
            let otherProposedChecksSuccess = lowestOpenGatedStatus != nil && all(
              filter(lowestOpenGatedStatus.Proposed.CommitStatuses ?? [], {
                #.Key != "change-management-open" && #.Key != "change-management-approval"
              }),
              { string(#.Phase) == "success" }
            );
            let lastStatusCode = ResponseOutput != nil ? ResponseOutput.statusCode : 0;
            let priorStepRaw = ResponseOutput != nil ? string(ResponseOutput.step ?? "") : "";
            // Recover stuck state: cancel 2xx + message (e.g. "already cancelled") was
            // misclassified as openFailed before response.output treated bare message as open.
            let priorStep = priorStepRaw == "openFailed" &&
              string(ResponseOutput.message ?? "") contains "already cancel"
              ? "cancelled"
              : priorStepRaw;
            let fromRO = ResponseOutput != nil ? string(ResponseOutput.changeId ?? "") : "";
            let priorChangeId = fromRO != "" ? fromRO : string(TriggerOutput.lastChangeId ?? "");
            let isRetryable = lastStatusCode == 429 || lastStatusCode >= 500;
            let isNewFingerprint = fingerprint != (TriggerOutput.lastFingerprint ?? "");
            let needsRetry = !isNewFingerprint && Phase != "success" &&
              (isRetryable || priorStep == "openRetry" || priorStep == "getRetry" || priorStep == "cancelRetry");
            let refAuthors = map(keyedEnvs, {
              let env = #;
              let status = find(statusEnvs, { #.Branch == env.Branch });
              let authorRef = status != nil
                ? find(status.Proposed.Dry.References ?? [], { #.Commit != nil && (#.Commit.Author ?? "") != "" })
                : nil;
              let raw = authorRef != nil ? authorRef.Commit.Author : "";
              trim(trim(split(raw, "<")[0]), "\"")
            });
            let dryAuthors = map(keyedEnvs, {
              let env = #;
              let status = find(statusEnvs, { #.Branch == env.Branch });
              let raw = status != nil ? (status.Proposed.Dry.Author ?? "") : "";
              trim(trim(split(raw, "<")[0]), "\"")
            });
            let uniqRefAuthors = uniq(refAuthors);
            let uniqDryAuthors = uniq(dryAuthors);
            let refAuthorsAgree = len(uniqRefAuthors) == 1 && uniqRefAuthors[0] != "";
            let dryAuthorsAgree = len(uniqDryAuthors) == 1 && uniqDryAuthors[0] != "";
            let refAuthor = refAuthorsAgree ? uniqRefAuthors[0] : "";
            let dryAuthor = dryAuthorsAgree ? uniqDryAuthors[0] : "";
            // Author fallback tiers: 0 = ref commit, 1 = proposed.dry.author, 2 = empty.
            // Bump the tier when the previous attempt returned 400 "is not an active user"
            // on the same fingerprint, OR when the current tier has no usable author
            // (envs disagree) so we'd otherwise silently send "" and skip the next tier.
            // Reset to 0 whenever the fingerprint rolls.
            let prevAuthorTier = int(TriggerOutput.authorTier ?? 0);
            let prevMessage = ResponseOutput != nil ? string(ResponseOutput.message ?? "") : "";
            let inactiveUserRejected = lastStatusCode == 400 && prevMessage contains "is not an active user";
            let bumpTier = !isNewFingerprint && inactiveUserRejected;
            let baseTier = isNewFingerprint ? 0 : (bumpTier ? prevAuthorTier + 1 : prevAuthorTier);
            // Skip tier 0 if ref authors disagree, skip tier 1 if dry authors disagree.
            let skip0 = baseTier == 0 && !refAuthorsAgree;
            let tierAfter0 = skip0 ? 1 : baseTier;
            let skip1 = tierAfter0 == 1 && !dryAuthorsAgree;
            let authorTier = skip1 ? 2 : tierAfter0;
            let commitAuthor = authorTier == 0 ? refAuthor : (authorTier == 1 ? dryAuthor : "");
            let gatesOk = hasOpenPRForKey && allNoteDryShasMatch && preGateNoOpenPR && otherProposedChecksSuccess;
            let wantFreshWork = isNewFingerprint || needsRetry || bumpTier;
            let openedFp = string(TriggerOutput.openedFingerprint ?? "");
            let sameOpenedFingerprint = openedFp != "" && openedFp == fingerprint;
            let cmStatus = ResponseOutput != nil ? string(ResponseOutput.cmStatus ?? "") : "";
            let crStart = ResponseOutput != nil ? string(ResponseOutput.crStartTime ?? "") : "";
            let crEnd = ResponseOutput != nil ? string(ResponseOutput.crEndTime ?? "") : "";
            let inWindow = crStart != "" && crEnd != "" &&
              date(crStart) <= now() && date(crEnd) >= now();
            let expired = !inWindow;
            let fingerprintRolled = !sameOpenedFingerprint;
            // Do not cancel terminal / approved / rejected CRs — only cancel when replacing
            // a still-active prior record after fingerprint roll or window expiry.
            let skipCancel = cmStatus == "APPROVED" ||
              cmStatus == "CONDITIONALLY_APPROVED" ||
              cmStatus == "CLOSED_SUCCESS" ||
              cmStatus == "CLOSED_FAILED" ||
              cmStatus == "CLOSED_ROLLED_BACK" ||
              cmStatus == "REJECTED";
            let wantCancel = priorChangeId != "" && (fingerprintRolled || expired) && !skipCancel;
            // Cancel before open when GET said needOpen/needCancel and cancel applies.
            let inCancelMode = priorChangeId != "" &&
              (priorStep == "needCancel" ||
               priorStep == "cancelRetry" ||
               (priorStep == "needOpen" && wantCancel));
            // After GET /status: reusable/rejected are fingerprint-scoped. A new dry SHA
            // (!sameOpenedFingerprint) always proceeds to POST open — including after REJECTED.
            // cancelled / cancelFailed mean cancel finished (or gave up) → POST open next.
            let needOpenFromStatus = priorChangeId != "" && !inCancelMode &&
              (priorStep == "needOpen" ||
               priorStep == "openRetry" ||
               priorStep == "cancelled" ||
               priorStep == "cancelFailed" ||
               ((priorStep == "reusable" || priorStep == "rejected") && !sameOpenedFingerprint));
            let statusHold = sameOpenedFingerprint &&
              (priorStep == "reusable" || priorStep == "rejected");
            // POST open when there is no prior id yet, or a prior GET/cancel/open said we must create/retry.
            let inOpenMode = (priorChangeId == "" && wantFreshWork) || needOpenFromStatus;
            // GET when we have a prior id and fresh work to do, but are not yet in cancel/open.
            let inGetMode = priorChangeId != "" && wantFreshWork && !inCancelMode && !needOpenFromStatus && !statusHold;
            let shouldTrigger = gatesOk && (inOpenMode || inGetMode || inCancelMode);
            // Fresh open (new fingerprint / first CR): 4h window. Same-fingerprint reopen
            // (window elapsed or other needOpen while openedFingerprint still matches): 24h.
            let openWindowModifier = (inOpenMode && sameOpenedFingerprint) ? "+24h" : "+4h";
            {
              hasOpenPRForKey: hasOpenPRForKey,
              allNoteDryShasMatch: allNoteDryShasMatch,
              isNewFingerprint: isNewFingerprint,
              needsRetry: needsRetry,
              preGateNoOpenPR: preGateNoOpenPR,
              otherProposedChecksSuccess: otherProposedChecksSuccess,
              fingerprint: fingerprint,
              canonicalNoteDrySha: canonicalNoteDrySha,
              commitAuthor: commitAuthor,
              authorTier: authorTier,
              needsAuthorRetry: bumpTier,
              lastStatusCode: lastStatusCode,
              priorChangeId: priorChangeId,
              priorStep: priorStep,
              inOpenMode: inOpenMode,
              inGetMode: inGetMode,
              inCancelMode: inCancelMode,
              wantCancel: wantCancel,
              shouldTrigger: shouldTrigger,
              gatesOk: gatesOk,
              wantFreshWork: wantFreshWork,
              sameOpenedFingerprint: sameOpenedFingerprint,
              openWindowModifier: openWindowModifier
            }
        # Fire GET (status), POST cancel, or POST open when gates pass and the phase flags say so.
        expression: |
          Variables.shouldTrigger
        output:
          # Persist fingerprint / author tier / openedFingerprint / lastChangeId across reconciles.
          expression: |
            let shouldTrigger = Variables.shouldTrigger;
            let priorMatches = Variables.fingerprint != "" &&
              Variables.fingerprint == (TriggerOutput.lastFingerprint ?? "");
            // Latch openedFingerprint only after a successful POST open. Reuse/rejected
            // holds keep the existing openedFingerprint from the prior open.
            let latchOpened = priorMatches && Variables.priorStep == "opened";
            let idFromResp = ResponseOutput != nil ? string(ResponseOutput.changeId ?? "") : "";
            let nextLastChangeId = idFromResp != ""
              ? idFromResp
              : (Variables.priorChangeId != "" ? Variables.priorChangeId : (TriggerOutput.lastChangeId ?? ""));
            {
              // Used elsewhere (read by templates / next reconciles):
              lastFingerprint: shouldTrigger ? Variables.fingerprint : (TriggerOutput.lastFingerprint ?? ""),
              authorTier: Variables.authorTier,
              commitAuthor: Variables.commitAuthor,
              openedFingerprint: latchOpened ? Variables.fingerprint : (TriggerOutput.openedFingerprint ?? ""),
              lastChangeId: nextLastChangeId,
              // Informational only (surfaced for debugging / status visibility):
              shouldTrigger: shouldTrigger,
              otherProposedChecksSuccess: Variables.otherProposedChecksSuccess,
              fingerprint: Variables.fingerprint,
              canonicalNoteDrySha: Variables.canonicalNoteDrySha,
              lastStatusCode: Variables.lastStatusCode,
              inOpenMode: Variables.inOpenMode,
              inGetMode: Variables.inGetMode,
              inCancelMode: Variables.inCancelMode,
              phase: Phase,
              evaluatedAt: string(now())
            }
      response:
        output:
          # response.output only has Response in scope (not TriggerOutput / PromotionStrategy).
          # GET: reusable / rejected / needCancel (expired+cancellable) / needOpen / getRetry
          # Cancel POST: cancelled / cancelRetry / cancelFailed (non-202 2xx or 4xx → proceed to open)
          # Open POST: opened / openRetry / openFailed
          expression: |
            let isStatusGet = Response.Body != nil && (Response.Body.status ?? nil) != nil;
            let cr = Response.Body != nil ? Response.Body.change_request : nil;
            let statusCode = Response.StatusCode;
            let msg = Response.Body != nil ? Response.Body.message : nil;
            let idFromBody = Response.Body != nil ? Response.Body.id : nil;
            let changeIdFromBody = idFromBody == nil ? "" : string(idFromBody);
            let cmStatus = isStatusGet ? string(Response.Body.status ?? "") : "";
            let crStart = cr != nil && cr.start_time != nil ? string(cr.start_time) : "";
            let crEnd = cr != nil && cr.end_time != nil ? string(cr.end_time) : "";
            let crShort = cr != nil && cr.short_description != nil ? string(cr.short_description) : "";
            let inWindow = cr != nil &&
              cr.start_time != nil && cr.end_time != nil &&
              date(cr.start_time) <= now() && date(cr.end_time) >= now();
            let reusableStatus = cmStatus == "APPROVED" || cmStatus == "CONDITIONALLY_APPROVED";
            let rejectedStatus = cmStatus == "REJECTED";
            let skipCancel = cmStatus == "APPROVED" ||
              cmStatus == "CONDITIONALLY_APPROVED" ||
              cmStatus == "CLOSED_SUCCESS" ||
              cmStatus == "CLOSED_FAILED" ||
              cmStatus == "CLOSED_ROLLED_BACK" ||
              cmStatus == "REJECTED";
            // Expired + not a skip-cancel status → cancel before open on next reconcile.
            // Other needOpen cases (e.g. in-window PENDING) defer cancel-vs-open to the trigger
            // (fingerprint roll still cancels via wantCancel).
            let getStep = statusCode == 200
              ? (inWindow && reusableStatus
                  ? "reusable"
                  : (inWindow && rejectedStatus
                      ? "rejected"
                      : (!inWindow && !skipCancel
                          ? "needCancel"
                          : "needOpen")))
              : (statusCode == 429 || statusCode >= 500 ? "getRetry" : "needOpen");
            let openOk = statusCode == 202 && changeIdFromBody != "";
            let postRetry = statusCode == 429 || statusCode >= 500;
            let openStep = openOk
              ? "opened"
              : (postRetry ? "openRetry" : "openFailed");
            let cancelOk = !isStatusGet && !openOk && statusCode >= 200 && statusCode < 300 && statusCode != 202;
            let cancelStep = cancelOk
              ? "cancelled"
              : (postRetry ? "cancelRetry" : "cancelFailed");
            // Open uses HTTP 202 (and id/change_request/error bodies on failure). Cancel uses
            // other 2xx (not 202); idempotent cancel may return message-only 200 — still cancel.
            let isCancelSuccessRange = cancelOk;
            let looksLikeOpenBody = Response.Body != nil &&
              ((Response.Body.change_request ?? nil) != nil ||
               (Response.Body.error ?? nil) != nil ||
               (Response.Body.id ?? nil) != nil ||
               ((Response.Body.message ?? nil) != nil && !isCancelSuccessRange));
            let step = isStatusGet
              ? getStep
              : (openOk || statusCode == 202 || looksLikeOpenBody ? openStep : cancelStep);
            let changeId = changeIdFromBody;
            {
              // Used elsewhere (read by templates / next reconciles):
              statusCode: statusCode,
              step: step,
              changeId: changeId,
              cmStatus: cmStatus,
              crStartTime: crStart,
              crEndTime: crEnd,
              crShortDescription: crShort,
              // Informational only (surfaced for debugging / status visibility):
              message: msg == nil ? "" : string(msg),
              changeRequest: cr ?? {},
              lastRequestedAt: string(now())
            }
---
apiVersion: promoter.argoproj.io/v1alpha1
kind: WebRequestCommitStatus
metadata:
  name: change-management-approval
  namespace: default
spec:
  promotionStrategyRef:
    name: argocon-demo
  key: change-management-approval
  reportOn: proposed
  # Polls the change-management service for an approved (and currently in-window) change record
  # matching the proposed dry SHA. Becomes success once one is found.
  descriptionTemplate: >-
    {{- $approvedCount := 0 -}}{{- $totalCount := 0 -}}{{- $statusCode := 0 -}}{{- $lastChecked := "" -}}
    {{- if .ResponseOutput -}}
      {{- $approvedCount = index .ResponseOutput "approvedCount"    | default 0 | int -}}
      {{- $totalCount    = index .ResponseOutput "totalRecordCount" | default 0 | int -}}
      {{- $statusCode    = index .ResponseOutput "statusCode"       | default 0 | int -}}
      {{- $lastChecked   = index .ResponseOutput "lastCheckedAt"    | default "" -}}
    {{- end -}}
    {{- $drySha := "" -}}{{- $currentFingerprint := "" -}}
    {{- if .TriggerVariables -}}
      {{- $drySha             = index .TriggerVariables "canonicalNoteDrySha" | default "" -}}
      {{- $currentFingerprint = index .TriggerVariables "fingerprint"         | default "" -}}
    {{- end -}}
    {{- $lastFiredFingerprint := "" -}}
    {{- if .TriggerOutput -}}{{- $lastFiredFingerprint = index .TriggerOutput "lastFingerprint" | default "" -}}{{- end -}}
    {{- $shaShort := "" -}}{{- if ne $drySha "" -}}{{- $shaShort = substr 0 7 $drySha -}}{{- end -}}
    {{- /* Stale = a new dry SHA arrived but the GET hasn't fired yet, so ResponseOutput is from the previous SHA. */ -}}
    {{- $stale := and (ne $currentFingerprint "") (ne $currentFingerprint $lastFiredFingerprint) -}}
    {{ .Phase }}:
    {{- if or (not .ResponseOutput) $stale }} checking for approved change record{{ if ne $shaShort "" }} for commit {{ $shaShort }}{{ end }}
    {{- else if and (eq $statusCode 200) (gt $approvedCount 0) }} {{ $approvedCount }} approved change record{{ if gt $approvedCount 1 }}s{{ end }} in window ({{ $totalCount }} total, last check {{ $lastChecked }})
    {{- else if eq $statusCode 200 }} {{ $approvedCount }}/{{ $totalCount }} records active in approval window (last check {{ $lastChecked }})
    {{- else }} approval check returned HTTP {{ $statusCode }}, will retry
    {{- end }}
  urlTemplate: >-
    {{- $assetId := index .NamespaceMetadata.Labels "argocd.intuit.com/asset-id" -}}
    {{- $ghDomain := index .NamespaceMetadata.Labels "argocd.intuit.com/github-domain" -}}
    {{- $portalHost := "devportal.intuit.com" -}}
    {{- if eq $ghDomain "github-dev" -}}{{- $portalHost = "devportal-e2e.intuit.com" -}}{{- end -}}
    {{- if ne $assetId "" -}}https://{{ $portalHost }}/app/dp/resource/{{ $assetId }}/changeManagement?asset={{ printf "{\"assetId\":\"%s\"}" $assetId | urlquery }}{{- end -}}
  httpRequest:
    methodTemplate: GET
    timeout: 30s
    headerTemplates:
      Accept: application/json
    urlTemplate: >-
      {{- $base := "http://localhost:8987/v1/change-management-service" -}}
      {{- $assetId := index .NamespaceMetadata.Labels "argocd.intuit.com/asset-id" -}}
      {{ $base }}/changes/search?asset_id={{ $assetId }}&commit_id={{ index .TriggerVariables "canonicalNoteDrySha" }}&limit=25
  success:
    when:
      variables:
        # Build the dry-SHA fingerprint so the no-response branch can carry forward success.
        expression: |
          let specEnvs = PromotionStrategy.Spec.Environments ?? [];
          let statusEnvs = PromotionStrategy.Status.Environments ?? [];
          let fingerprint = join(map(specEnvs, {
            let env = #;
            let status = find(statusEnvs, { #.Branch == env.Branch });
            env.Branch + ":" + (status != nil && status.Proposed.Note != nil && status.Proposed.Note.DrySha != "" ? status.Proposed.Note.DrySha : "")
          }), "|");
          { fingerprint: fingerprint }
      # Success when GET returned 200 and at least one record is approved AND currently in its window,
      # or (no HTTP this reconcile) we're already in success on the same fingerprint.
      expression: |
        Response != nil
          ? (Response.StatusCode == 200 &&
             len(Response.Body.change_records) > 0 &&
             any(Response.Body.change_records, {
               date(#.change_request.start_time) <= now() &&
               date(#.change_request.end_time) >= now() &&
               ((#.status ?? "") == "APPROVED" || (#.status ?? "") == "CONDITIONALLY_APPROVED")
             }))
          : (Phase == "success" && Variables.fingerprint == (TriggerOutput["lastFingerprint"] ?? ""))
  mode:
    context: promotionstrategy
    trigger:
      requeueDuration: 15s
      when:
        variables:
          # Compute trigger gates plus a 1-minute polling interval so we don't hammer the service.
          expression: |
            let key = "change-management-approval";
            let specEnvs = PromotionStrategy.Spec.Environments ?? [];
            let statusEnvs = PromotionStrategy.Status.Environments ?? [];
            let keyIsGlobal = any(PromotionStrategy.Spec.ProposedCommitStatuses ?? [], {#.Key == key});
            let firstGatedIdx = findIndex(specEnvs, {
              keyIsGlobal || any(#.ProposedCommitStatuses ?? [], {#.Key == key})
            });
            let preGatedEnvs = (firstGatedIdx != nil && firstGatedIdx > 0)
              ? take(specEnvs, firstGatedIdx)
              : [];
            let preGateNoOpenPR = all(preGatedEnvs, {
              let env = #;
              let status = find(statusEnvs, { #.Branch == env.Branch });
              status == nil || status.PullRequest == nil || string(status.PullRequest.State) != "open"
            });
            // Per spec-env {branch, proposed-note dry SHA} pairs (sha "" when absent), spec order.
            // Everything downstream (dry-SHA alignment, canonical SHA, fingerprint) derives from this.
            let envShas = map(specEnvs, {
              let env = #;
              let status = find(statusEnvs, { #.Branch == env.Branch });
              { branch: env.Branch, sha: status != nil && status.Proposed.Note != nil && status.Proposed.Note.DrySha != "" ? status.Proposed.Note.DrySha : "" }
            });
            let everyEnvHasDrySha = len(envShas) > 0 && all(envShas, { #.sha != "" });
            let canonicalNoteDrySha = len(envShas) > 0 ? envShas[0].sha : "";
            let allNoteDryShasMatch = everyEnvHasDrySha && all(envShas, { #.sha == canonicalNoteDrySha });
            let fingerprint = join(map(envShas, { #.branch + ":" + #.sha }), "|");
            let hasOpenPRForKey = any(specEnvs, {
              let env = #;
              let envHasKey = keyIsGlobal || any(env.ProposedCommitStatuses ?? [], {#.Key == key});
              let status = find(statusEnvs, { #.Branch == env.Branch });
              envHasKey && status != nil && status.PullRequest != nil && string(status.PullRequest.State) == "open"
            });
            let pollingIntervalMinutes = 1;
            let isFirstRun = TriggerOutput.lastRequestTime == nil;
            let isNewFingerprint = fingerprint != (TriggerOutput.lastFingerprint ?? "");
            let pollingIntervalElapsed = !isFirstRun && (
              (now() - date(TriggerOutput.lastRequestTime)) >= duration(string(pollingIntervalMinutes) + "m")
            );
            {
              hasOpenPRForKey: hasOpenPRForKey,
              allNoteDryShasMatch: allNoteDryShasMatch,
              preGateNoOpenPR: preGateNoOpenPR,
              fingerprint: fingerprint,
              canonicalNoteDrySha: canonicalNoteDrySha,
              isFirstRun: isFirstRun,
              isNewFingerprint: isNewFingerprint,
              pollingIntervalElapsed: pollingIntervalElapsed
            }
        # Fire the GET when gates pass and we either haven't run yet, have a fresh fingerprint,
        # or the polling interval has elapsed.
        expression: |
          Variables.hasOpenPRForKey && Variables.allNoteDryShasMatch && (Variables.isFirstRun || Variables.isNewFingerprint || Variables.pollingIntervalElapsed) && Variables.preGateNoOpenPR
        output:
          # lastFingerprint advances only when we actually fire the GET — if a new fingerprint
          # arrives but trigger gates block it, the description template uses the mismatch
          # between TriggerVariables.fingerprint and lastFingerprint to flag stale ResponseOutput.
          expression: |
            let shouldTrigger = Variables.hasOpenPRForKey && Variables.allNoteDryShasMatch && (Variables.isFirstRun || Variables.isNewFingerprint || Variables.pollingIntervalElapsed) && Variables.preGateNoOpenPR;
            {
              // Used elsewhere (read by templates / next reconciles):
              lastFingerprint: shouldTrigger ? Variables.fingerprint : (TriggerOutput.lastFingerprint ?? ""),
              lastRequestTime: shouldTrigger ? now() : TriggerOutput.lastRequestTime,
              // Informational only (surfaced for debugging / status visibility):
              shouldTrigger: shouldTrigger,
              fingerprint: Variables.fingerprint,
              canonicalNoteDrySha: Variables.canonicalNoteDrySha,
              evaluatedAt: string(now())
            }
      response:
        output:
          # Count in-window APPROVED/CA records, ordered by start_time closest to now.
          expression: |
            let approvedRecords = sortBy(
              filter(Response.Body.change_records ?? [], {
                date(#.change_request.start_time) <= now() &&
                date(#.change_request.end_time) >= now() &&
                ((#.status ?? "") == "APPROVED" || (#.status ?? "") == "CONDITIONALLY_APPROVED")
              }),
              abs((date(#.change_request.start_time) - now()).Seconds())
            );
            {
              // Used elsewhere (read by templates / next reconciles):
              statusCode: Response.StatusCode,
              totalRecordCount: len(Response.Body.change_records ?? []),
              approvedCount: len(approvedRecords),
              lastCheckedAt: string(now()),
              // Informational only (surfaced for debugging / status visibility):
              approvedRecords: approvedRecords
            }
