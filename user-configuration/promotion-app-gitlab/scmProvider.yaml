apiVersion: promoter.argoproj.io/v1alpha1
kind: ScmProvider
metadata:
  name: scmprovider-gitlab
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # SaaS gitlab.com: omit domain (setting "gitlab.com" is rejected by the API).
  gitlab: {}
  secretRef:
    name: gitlab-auth
